# Databricks Job (Asset Bundle resource format): Bronze -> Silver -> Gold
# Notebook paths are relative to this file.
resources:
  jobs:
    steam_medallion_pipeline:
      name: steam_medallion_pipeline
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/bronze/Bronze

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/silver/Silver_New

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/gold/Gold
